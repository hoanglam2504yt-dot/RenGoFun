    <!-- ═══════════════════════════════════════════════════════════════
         Inter Variable Font — Google Fonts
         Tại sao Variable Font?
         - Tải 1 file duy nhất thay vì nhiều file weight riêng lẻ
         - Cho phép fine-tune weight chính xác (vd: 380 thay vì 400)
           → cực kỳ cần thiết để tối ưu độ dày chữ trên Dark Theme
         wght=100..900 bao gồm toàn bộ dải từ Thin đến Black
    ════════════════════════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
